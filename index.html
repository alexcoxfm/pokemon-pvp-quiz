<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3ba8f5">
  <meta name="description" content="Practice Pokemon GO PVP Battle League matchup knowledge">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <title>PVP Quiz - Pokemon GO</title>
</head>
<body>
  <div id="app">
    <!-- Offline Banner -->
    <div id="offline-banner" class="offline-banner hidden" aria-live="polite">
      You're offline — using cached data
    </div>

    <!-- Screen 1: League Selection -->
    <section id="screen-home" class="screen active">
      <div class="container">
        <header class="app-header">
          <span class="header-sparkle s1" aria-hidden="true"></span>
          <span class="header-sparkle s2" aria-hidden="true"></span>
          <span class="header-sparkle s3" aria-hidden="true"></span>
          <span class="header-sparkle s4" aria-hidden="true"></span>
          <h1 class="app-title">PVP Quiz</h1>
          <p class="app-subtitle">Pokemon GO Battle League</p>
        </header>

        <div class="league-section">
          <h2 class="section-title">Pick a league</h2>
          <div class="league-buttons">
            <button class="league-btn" data-league="1500" data-league-name="Great League">
              <span class="league-icon great"></span>
              <span class="league-name">Great League</span>
              <span class="league-cp">CP 1500</span>
            </button>
            <button class="league-btn" data-league="2500" data-league-name="Ultra League">
              <span class="league-icon ultra"></span>
              <span class="league-name">Ultra League</span>
              <span class="league-cp">CP 2500</span>
            </button>
            <button class="league-btn" data-league="10000" data-league-name="Master League">
              <span class="league-icon master"></span>
              <span class="league-name">Master League</span>
              <span class="league-cp">No Limit</span>
            </button>
          </div>
        </div>

        <div id="cups-section" class="cups-section hidden">
          <h2 class="section-title">Special cups</h2>
          <div id="cups-buttons" class="league-buttons"></div>
        </div>

        <div id="session-score" class="session-score hidden">
          <p>Last session: <span id="last-score"></span></p>
        </div>

        <p id="meta-date" class="meta-date"></p>
      </div>
    </section>

    <!-- Screen 2: Quiz -->
    <section id="screen-quiz" class="screen">
      <div class="container">
        <div class="quiz-header">
          <button id="btn-back" class="btn-back" aria-label="Go back">&#8592;</button>
          <div class="quiz-league-info">
            <span id="quiz-league-name" class="league-badge"></span>
            <span id="quiz-round" class="round-counter"></span>
          </div>
        </div>

        <p class="quiz-prompt">Who wins?</p>

        <div class="pokemon-matchup">
          <button class="pokemon-card" id="pokemon-a" aria-label="Select Pokemon A">
            <div class="pokemon-img-wrapper">
              <img id="pokemon-a-img" src="" alt="" class="pokemon-img" loading="eager">
              <div class="img-placeholder"></div>
            </div>
            <h3 id="pokemon-a-name" class="pokemon-name"></h3>
            <div id="pokemon-a-types" class="pokemon-types"></div>
          </button>

          <div class="vs-badge" aria-hidden="true">VS</div>

          <button class="pokemon-card" id="pokemon-b" aria-label="Select Pokemon B">
            <div class="pokemon-img-wrapper">
              <img id="pokemon-b-img" src="" alt="" class="pokemon-img" loading="eager">
              <div class="img-placeholder"></div>
            </div>
            <h3 id="pokemon-b-name" class="pokemon-name"></h3>
            <div id="pokemon-b-types" class="pokemon-types"></div>
          </button>
        </div>

        <div id="loading-quiz" class="loading hidden">
          <div class="spinner"></div>
          <p>Loading matchup data...</p>
        </div>
      </div>
    </section>

    <!-- Screen 3: Result -->
    <section id="screen-result" class="screen">
      <div class="container">
        <div id="result-banner" class="result-banner">
          <div class="burst" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <h2 id="result-text"></h2>
        </div>

        <div class="result-matchup">
          <div class="result-pokemon" id="result-pokemon-a">
            <div class="result-img-wrapper">
              <img id="result-a-img" src="" alt="" class="pokemon-img">
            </div>
            <h3 id="result-a-name" class="pokemon-name"></h3>
            <div id="result-a-types" class="pokemon-types"></div>
          </div>

          <div class="result-vs" aria-hidden="true">VS</div>

          <div class="result-pokemon" id="result-pokemon-b">
            <div class="result-img-wrapper">
              <img id="result-b-img" src="" alt="" class="pokemon-img">
            </div>
            <h3 id="result-b-name" class="pokemon-name"></h3>
            <div id="result-b-types" class="pokemon-types"></div>
          </div>
        </div>

        <div id="explanation" class="explanation">
          <div id="explain-types" class="explain-section"></div>
          <div id="explain-rating" class="explain-section"></div>
          <div id="explain-moveset" class="explain-section"></div>
          <div id="explain-dominance" class="explain-section"></div>
          <div id="explain-notes" class="explain-section"></div>
        </div>

        <button id="btn-next" class="btn-primary">Next round</button>
      </div>
    </section>

    <!-- Screen 4: Score Summary -->
    <section id="screen-summary" class="screen">
      <div class="container">
        <header class="summary-header">
          <h2>Quiz complete!</h2>
          <div id="final-score" class="final-score"></div>
        </header>

        <div id="round-results" class="round-results"></div>

        <div class="summary-actions">
          <button id="btn-play-again" class="btn-primary">Play again</button>
          <button id="btn-change-league" class="btn-secondary">Change league</button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
